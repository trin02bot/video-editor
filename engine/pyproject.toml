[project]
name = "studio-engine"
version = "0.1.0"
description = "AI multicam podcast editor engine: sync, multicam edit, audio leveling, trailer and vertical shorts."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "librosa>=0.10",
  "opencv-python-headless>=4.8",
  "mediapipe>=0.10.14",
  "faster-whisper>=1.0",
  "pillow>=10",
  "pyyaml>=6",
  "anthropic>=0.70",
  "httpx>=0.27",
]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]
